name: CI

# Closes the remaining M1 item: the acceptance suite has only ever run on macOS-arm64, and
# Windows/Linux need machines rather than more code.

on:
  push: { branches: [main] }
  pull_request:

env:
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@v4

      - name: Export GitHub Actions cache env
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgl1-mesa-dev libx11-dev \
            libxmu-dev libxi-dev libfontconfig1-dev autoconf automake libtool

      - uses: lukka/run-vcpkg@v11
        with:
          # Must match builtin-baseline in vcpkg.json, or the pinned OCCT is not what builds.
          vcpkgGitCommitId: dc31f86a441067d6c2e9e4ad52988eb41ef4f442

      - uses: dtolnay/rust-toolchain@stable

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake
          -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Build
        run: cmake --build build -j

      - name: Layering
        run: python3 tools/check_layering.py .

      - name: C++ tests
        run: ctest --test-dir build --output-on-failure

      - name: Rust tests
        working-directory: tests-rs
        env:
          CAD_BUILD_DIR: ${{ github.workspace }}/build
          # Windows and Linux resolve the shared library at run time differently from the
          # absolute install_name we bake in on macOS.
          LD_LIBRARY_PATH: ${{ github.workspace }}/build/core/abi
          PATH_EXTRA: ${{ github.workspace }}/build/core/abi
        run: cargo test --workspace

  asan:
    name: ASan + UBSan (macOS)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: dc31f86a441067d6c2e9e4ad52988eb41ef4f442
      - name: Configure
        run: >
          cmake -S . -B build-asan -G Ninja
          -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake
          -DCMAKE_BUILD_TYPE=Debug -DCAD_ENABLE_ASAN=ON -DCAD_BUILD_SPIKES=OFF
      - name: Build
        run: cmake --build build-asan -j
      - name: Test
        run: ASAN_OPTIONS=detect_leaks=0 ctest --test-dir build-asan --output-on-failure
