name: CI

# Closes the last outstanding M1 item: the suite has only ever run on macOS-arm64.
#
# Everything here is shaped by one fact — the first build compiles OCCT from source, which
# takes 30–60 minutes. Without a working binary cache this workflow is unusable, so the
# vcpkg GHA cache is load-bearing rather than an optimisation, and the job is split so a
# compile error surfaces without waiting for the whole matrix.

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**', 'LICENSE']
  pull_request:
    paths-ignore: ['**/*.md', 'docs/**', 'LICENSE']
  workflow_dispatch:

concurrency:
  # A new push supersedes an in-flight run on the same ref. With hour-long builds, letting
  # them queue up wastes the runner budget on results nobody will read.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The pinned vcpkg commit MUST match builtin-baseline in vcpkg.json, or CI silently tests
  # a different OCCT than developers do.
  VCPKG_COMMIT: dc31f86a441067d6c2e9e4ad52988eb41ef4f442
  CARGO_TERM_COLOR: always

  # Binary caching, and the single thing that decides whether this workflow is usable.
  #
  # NOT x-gha. That provider talks to the legacy Actions Cache API, which GitHub has
  # retired; it fails silently, so every run rebuilt OCCT from source and the repo cache
  # sat at zero entries. Diagnosed by checking /actions/cache/usage, which reported
  # 0 caches after several full runs.
  #
  # A plain `files` provider plus actions/cache@v4 is dumber and works: v4 speaks the
  # current cache service, and the archive directory is inspectable when something is off.
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-archives
  VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/.vcpkg-archives,readwrite"

jobs:
  # Structural checks that need no compiler. Seconds, not minutes — so a layering violation
  # or a stale ABI declaration fails before anyone waits on OCCT.
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Layer include direction
        run: python3 tools/check_layering.py .

      - name: ABI header and Rust declarations agree
        # The FFI bindings are hand-written on purpose (ADR 0006). This is the tripwire that
        # makes "hand-written" safe: if the C header's version moves and cad-sys does not,
        # the two have drifted and someone forgot to update the other half.
        run: |
          header=$(grep -oP 'CAD_ABI_VERSION_MINOR\s+\K\d+' \
            abi/include/cad/abi/cad_plugin_abi.h)
          rust=$(grep -oP 'CAD_ABI_VERSION_MINOR: u32 = \K\d+' \
            tests-rs/cad-sys/src/lib.rs)
          echo "C header: $header, cad-sys: $rust"
          if [ "$header" != "$rust" ]; then
            echo "::error::ABI minor version mismatch — the C header and cad-sys must change together"
            exit 1
          fi

      - name: vcpkg baseline matches CI pin
        run: |
          manifest=$(python3 -c "import json;print(json.load(open('vcpkg.json'))['builtin-baseline'])")
          echo "manifest: $manifest / workflow: $VCPKG_COMMIT"
          if [ "$manifest" != "$VCPKG_COMMIT" ]; then
            echo "::error::vcpkg.json baseline and the workflow pin disagree; CI would test a different OCCT"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Rust formatting
        working-directory: tests-rs
        run: cargo fmt --all --check

  test:
    name: ${{ matrix.name }}
    needs: lint
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180     # a COLD OCCT build is slow; cached runs are minutes
    strategy:
      fail-fast: false       # one platform failing must not hide the others
      matrix:
        include:
          - name: Linux (gcc)
            os: ubuntu-24.04
            preset: RelWithDebInfo
          - name: Windows (MSVC)
            os: windows-2022
            preset: RelWithDebInfo
          - name: macOS (arm64)
            os: macos-14
            preset: RelWithDebInfo

    steps:
      # No submodules: assetlib is vendored in-tree at modules/assetlib.
      - uses: actions/checkout@v4

      - name: Prepare binary cache directory
        shell: bash
        run: mkdir -p "${{ github.workspace }}/.vcpkg-archives"

      # ROLLING key: the save key ends in the run id, so it is always unique.
      #
      # This is not stylistic. With a fixed key, two runs I cancelled after five minutes saved
      # 6 MB stubs under the exact key. Every later run then got a cache HIT on a nearly-empty
      # archive, which made `cache-hit == 'true'`, which SKIPPED the save — so the real OCCT
      # was never stored and every run rebuilt it. A poisoned key is unrecoverable without
      # deleting the entry by hand, which is what we had to do.
      #
      # With a unique save key, a stale or partial entry can never block a save, and
      # restore-keys returns the most recently created prefix match — so a more complete cache
      # naturally supersedes a less complete one.
      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/.vcpkg-archives
          # Prefix covers everything that changes the built bytes: runner image, pinned vcpkg
          # commit, manifest, triplet overlays. Nothing else may invalidate an hour of OCCT.
          key: vcpkg-${{ matrix.os }}-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json', 'cmake/triplets/*.cmake') }}-${{ github.run_id }}
          restore-keys: |
            vcpkg-${{ matrix.os }}-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json', 'cmake/triplets/*.cmake') }}-
            vcpkg-${{ matrix.os }}-${{ env.VCPKG_COMMIT }}-

      - name: Count cached packages before configure
        id: pkgs-before
        shell: bash
        run: |
          n=$(find "${{ github.workspace }}/.vcpkg-archives" -name '*.zip' 2>/dev/null | wc -l | tr -d ' ')
          echo "count=$n" >> "$GITHUB_OUTPUT"
          echo "restored $n cached packages"

      # OCCT needs X11/GL headers to configure even though we never link its visualisation
      # toolkits: its CMake probes for them unconditionally.
      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build \
            libgl1-mesa-dev libglu1-mesa-dev \
            libx11-dev libxext-dev libxmu-dev libxi-dev libxt-dev \
            libfontconfig1-dev libfreetype-dev \
            autoconf autoconf-archive automake libtool pkg-config \
            gperf bison flex \
            python3-dev

      - name: macOS system dependencies
        if: runner.os == 'macOS'
        run: brew install ninja autoconf autoconf-archive automake libtool

      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python build dependencies
        # pybind11 comes from the interpreter we bind to, never from vcpkg — its port builds
        # a whole CPython and fails on arm64-osx.
        run: python -m pip install --upgrade pip pybind11 pytest

      - uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT }}

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tests-rs

      - name: Configure
        id: configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake
          -DVCPKG_OVERLAY_TRIPLETS=${{ github.workspace }}/cmake/triplets
          -DCMAKE_BUILD_TYPE=${{ matrix.preset }}

      - name: Binary cache report
        id: pkgs-after
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          dir="${{ github.workspace }}/.vcpkg-archives"
          n=$(find "$dir" -name '*.zip' 2>/dev/null | wc -l | tr -d ' ')
          echo "count=$n" >> "$GITHUB_OUTPUT"
          echo "archives: $n packages, $(du -sh "$dir" 2>/dev/null | cut -f1) (was ${{ steps.pkgs-before.outputs.count }})"
          if [ "$n" -eq 0 ]; then
            echo "::warning::vcpkg wrote no binary archives — the cache is not working"
          fi

      # Save only when configure ADDED packages. Two guards, each earning its place:
      #   * package count increased — otherwise a warm run re-uploads an identical archive
      #     every time, churning the repo's 10 GB budget for nothing.
      #   * !cancelled() — a cancelled run has a half-built archive, and saving those is what
      #     poisoned the keys in the first place.
      # Placed right after configure, so a later compile failure still banks the dependencies.
      - name: Save vcpkg binary cache
        if: ${{ !cancelled() && steps.pkgs-after.outputs.count > steps.pkgs-before.outputs.count }}
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/.vcpkg-archives
          key: vcpkg-${{ matrix.os }}-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json', 'cmake/triplets/*.cmake') }}-${{ github.run_id }}

      - name: Build
        run: cmake --build build -j

      - name: C++ tests
        # vcpkg's toolchain copies dependency DLLs next to built executables on Windows, so
        # ctest needs no extra path setup. The Rust step below does — see its comment.
        run: ctest --test-dir build --output-on-failure --timeout 300

      # The C ABI is a shared library, and only macOS finds it without help: we bake an
      # absolute install name into the dylib. Linux needs LD_LIBRARY_PATH; Windows needs the
      # DLL's directory on PATH. Cargo's `rustc-link-arg` cannot supply an rpath to a
      # DOWNSTREAM crate's test binary, which is why this is set here rather than in
      # cad-sys/build.rs.
      - name: Rust tests (Linux)
        if: runner.os == 'Linux'
        working-directory: tests-rs
        env:
          CAD_BUILD_DIR: ${{ github.workspace }}/build
          LD_LIBRARY_PATH: ${{ github.workspace }}/build/abi
        run: cargo test --workspace -- --nocapture

      - name: Rust tests (Windows)
        if: runner.os == 'Windows'
        working-directory: tests-rs
        env:
          CAD_BUILD_DIR: ${{ github.workspace }}\build
        shell: pwsh
        run: |
          # Two directories, both required. Windows is the only platform where vcpkg's
          # default library linkage is DYNAMIC, so OCCT itself ships as DLLs alongside our
          # cad_abi.dll. The Rust test binary needs to find both.
          $abi = "${{ github.workspace }}\build\abi"
          $deps = "${{ github.workspace }}\build\vcpkg_installed\x64-windows\bin"
          $env:PATH = "$abi;$deps;$env:PATH"
          cargo test --workspace

      - name: Rust tests (macOS)
        if: runner.os == 'macOS'
        working-directory: tests-rs
        env:
          CAD_BUILD_DIR: ${{ github.workspace }}/build
        run: cargo test --workspace

      - name: Python binding tests
        env:
          PYTHONPATH: ${{ github.workspace }}/bindings/python
        run: python -m pytest bindings/python/tests -q

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.os }}
          path: |
            build/CMakeFiles/CMakeConfigureLog.yaml
            build/Testing/Temporary/LastTest.log
            vcpkg/buildtrees/**/*.log
          retention-days: 7
          if-no-files-found: ignore

  sanitizers:
    name: ASan + UBSan
    needs: lint
    # Not on pull requests. It rebuilds the same dependencies as the Linux test job, and on a
    # cold cache the two race and both pay full price. A PR still gets all three platforms;
    # this runs on the merge to main, before anything ships.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Prepare binary cache directory
        run: mkdir -p "${{ github.workspace }}/.vcpkg-archives"

      # Same triplet as the Linux test job, so this restores THAT job's archives rather than
      # building OCCT a second time for the same platform.
      # Shares the Linux test job's archives — same triplet, same prefix.
      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/.vcpkg-archives
          key: vcpkg-ubuntu-24.04-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json', 'cmake/triplets/*.cmake') }}-${{ github.run_id }}
          restore-keys: |
            vcpkg-ubuntu-24.04-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json', 'cmake/triplets/*.cmake') }}-
            vcpkg-ubuntu-24.04-${{ env.VCPKG_COMMIT }}-

      - name: Count cached packages before configure
        id: pkgs-before
        run: |
          n=$(find "${{ github.workspace }}/.vcpkg-archives" -name '*.zip' 2>/dev/null | wc -l | tr -d ' ')
          echo "count=$n" >> "$GITHUB_OUTPUT"
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build libgl1-mesa-dev libglu1-mesa-dev libx11-dev libxext-dev \
            libxmu-dev libxi-dev libxt-dev libfontconfig1-dev libfreetype-dev \
            autoconf autoconf-archive automake libtool pkg-config gperf bison flex
      - uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT }}
      - name: Configure
        run: >
          cmake -S . -B build-asan -G Ninja
          -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake
          -DVCPKG_OVERLAY_TRIPLETS=${{ github.workspace }}/cmake/triplets
          -DCMAKE_BUILD_TYPE=Debug -DCAD_ENABLE_ASAN=ON -DCAD_BUILD_SPIKES=OFF
      - name: Count cached packages after configure
        id: pkgs-after
        if: ${{ !cancelled() }}
        run: |
          n=$(find "${{ github.workspace }}/.vcpkg-archives" -name '*.zip' 2>/dev/null | wc -l | tr -d ' ')
          echo "count=$n" >> "$GITHUB_OUTPUT"
          echo "archives: $n packages (was ${{ steps.pkgs-before.outputs.count }})"

      - name: Save vcpkg binary cache
        if: ${{ !cancelled() && steps.pkgs-after.outputs.count > steps.pkgs-before.outputs.count }}
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/.vcpkg-archives
          key: vcpkg-ubuntu-24.04-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json', 'cmake/triplets/*.cmake') }}-${{ github.run_id }}

      - name: Build
        run: cmake --build build-asan -j
      - name: Test
        # OCCT allocates plenty it never frees at exit; leak detection would drown the
        # signal we actually want, which is memory errors and UB.
        env:
          ASAN_OPTIONS: detect_leaks=0
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build-asan --output-on-failure --timeout 600
